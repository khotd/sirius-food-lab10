name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-unit-test-key
      SQL_ECHO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests without external services
        run: >-
          python -m pytest -q tests/test_architecture.py tests/test_auth_service.py
          tests/test_grpc_client.py tests/test_orders_service.py tests/test_rate_limit.py
          tests/test_tasks.py tests/test_users_service.py tests/practice --junitxml=reports/unit.xml
      - name: Integration tests with disposable PostgreSQL and Redis
        run: python -m pytest tests/integration -v --junitxml=reports/integration.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/*.xml
